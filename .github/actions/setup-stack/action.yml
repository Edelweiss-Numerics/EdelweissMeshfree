name: Set up the stack
description: >-
  EdelweissFE's locked conda environment, Marmot (its build cached per commit), EdelweissFE and EdelweissMeshfree
  (editable), each from the same-named branch if it exists, else from the PR's base branch.

inputs:
  edelweissfe_branch:
    description: "Branch to use for EdelweissFE (empty: auto-detect)"
    required: false
    default: ""
  marmot_branch:
    description: "Branch to use for Marmot (empty: auto-detect)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The EdelweissFE branch to build against: the same-named branch, else the PR's base branch.
    # Cloned first: its conda-lock.yml defines the environment.
    - name: Select EdelweissFE
      shell: bash
      run: |
        BRANCH="${{ inputs.edelweissfe_branch || github.head_ref || github.ref_name }}"
        BASE="${{ github.base_ref || 'master' }}"

        URL="https://github.com/Edelweiss-Numerics/EdelweissFE.git"
        if git ls-remote --exit-code --heads "$URL" "$BRANCH" > /dev/null 2>&1; then
          echo "Cloning EdelweissFE branch: $BRANCH"
          git clone --depth 1 --branch "$BRANCH" "$URL" "$RUNNER_TEMP/EdelweissFE"
        elif [ -n "$BASE" ] && git ls-remote --exit-code --heads "$URL" "$BASE" > /dev/null 2>&1; then
          echo "::warning title=EdelweissFE Branch Fallback::Branch '$BRANCH' not found. Falling back to PR base branch '$BASE'."
          git clone --depth 1 --branch "$BASE" "$URL" "$RUNNER_TEMP/EdelweissFE"
        else
          echo "::warning title=EdelweissFE Branch Fallback::Neither branch '$BRANCH' nor base '$BASE' found. Falling back to default branch."
          git clone --depth 1 "$URL" "$RUNNER_TEMP/EdelweissFE"
        fi

    # Exactly what EdelweissFE's conda-lock.yml pins (no solving), as EdelweissFE's own CI installs it
    # (its .github/actions/setup-locked-env): compilers, CMake, Eigen, autodiff, Fastor, AMGCL, the
    # free-threaded Python and the Python packages both projects need.
    - uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: ${{ runner.temp }}/EdelweissFE/conda-lock.yml
        environment-name: edelweissfe
        cache-environment: true
        init-shell: bash

    # The Marmot branch to build against: the requested one, else the same-named branch, else the PR's base branch,
    # else master. Resolved to its current commit, which keys the cache of the Marmot build below.
    - name: Resolve Marmot
      id: marmot
      shell: bash -eo pipefail {0}
      # Passed through the environment, never pasted into the script: branch names come from (fork) pull requests
      # and may contain shell syntax.
      env:
        INPUT_REF: ${{ inputs.marmot_branch }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        REF_NAME: ${{ github.ref_name }}
        LOCK_FILE: ${{ runner.temp }}/EdelweissFE/conda-lock.yml
      run: |
        URL="https://github.com/MAteRialMOdelingToolbox/Marmot.git"
        branch=""
        for candidate in "$INPUT_REF" "$HEAD_REF" "$REF_NAME" "$BASE_REF" master; do
          [ -n "$candidate" ] || continue
          sha=$(git ls-remote "$URL" "refs/heads/$candidate" | cut -f1)
          if [ -n "$sha" ]; then
            branch=$candidate
            break
          fi
        done
        if [ -z "$branch" ]; then
          echo "::error::No Marmot branch found to build against."
          false
        fi
        echo "Using Marmot branch $branch at $sha"
        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        # The environment Marmot is compiled in (the lock file lives outside the workspace, out of hashFiles' reach).
        echo "lock=$(sha256sum "$LOCK_FILE" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # A Marmot build is reused as long as the Marmot commit, the locked environment and this action are unchanged.
    - uses: actions/cache@v4
      id: marmot-cache
      with:
        path: ${{ runner.temp }}/marmot
        key: marmot-${{ runner.os }}-${{ runner.arch }}-${{ steps.marmot.outputs.sha }}-${{ steps.marmot.outputs.lock }}-${{ hashFiles('.github/actions/setup-stack/action.yml') }}

    - name: Build Marmot
      if: steps.marmot-cache.outputs.cache-hit != 'true'
      shell: bash -leo pipefail {0}
      env:
        MARMOT_BRANCH: ${{ steps.marmot.outputs.branch }}
        MARMOT_SHA: ${{ steps.marmot.outputs.sha }}
      run: |
        # Exactly the resolved commit, even if the branch moved on meanwhile: the cache key names it.
        echo "Building Marmot branch $MARMOT_BRANCH at $MARMOT_SHA"
        git init -q "$RUNNER_TEMP/Marmot"
        git -C "$RUNNER_TEMP/Marmot" fetch -q --depth 1 https://github.com/MAteRialMOdelingToolbox/Marmot.git "$MARMOT_SHA"
        git -C "$RUNNER_TEMP/Marmot" checkout -q --detach FETCH_HEAD
        cmake -S "$RUNNER_TEMP/Marmot" -B "$RUNNER_TEMP/Marmot/build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/marmot" \
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DBUILD_TESTING=OFF
        cmake --build "$RUNNER_TEMP/Marmot/build" --parallel 4
        cmake --install "$RUNNER_TEMP/Marmot/build"

    # Into the environment, where EdelweissMeshfree's setup.py finds Marmot (and Eigen next to it) by default.
    - name: Install Marmot
      shell: bash -leo pipefail {0}
      run: |
        cp -a "$RUNNER_TEMP/marmot/." "$CONDA_PREFIX/"

    # --no-deps --no-build-isolation: everything comes from the locked environment, as in
    # EdelweissFE's CI; pip must neither resolve nor build in an isolated environment of its own.
    - name: Install EdelweissFE
      shell: bash -leo pipefail {0}
      run: |
        pip install -v --no-deps --no-build-isolation -e "$RUNNER_TEMP/EdelweissFE"

    - name: Build EdelweissMeshfree
      shell: bash -leo pipefail {0}
      run: |
        pip install -v --no-deps --no-build-isolation -e .
