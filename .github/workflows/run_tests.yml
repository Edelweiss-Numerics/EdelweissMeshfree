name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      edelweissfe_branch:
        description: "Branch to use for EdelweissFE (leave empty to auto-detect)"
        required: false
        default: ""
      marmot_branch:
        description: "Branch to use for Marmot and all Marmot modules (leave empty to auto-detect)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: ./.github/actions/setup-stack
        with:
          edelweissfe_branch: ${{ inputs.edelweissfe_branch }}
          marmot_branch: ${{ inputs.marmot_branch }}

      - name: Run tests
        shell: bash -leo pipefail {0}
        run: |
          pytest .

