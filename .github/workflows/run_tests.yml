name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      edelweissfe_branch:
        description: "Branch to use for EdelweissFE (leave empty to auto-detect)"
        required: false
        default: ""
      marmot_branch:
        description: "Branch to use for Marmot and all Marmot modules (leave empty to auto-detect)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # The EdelweissFE branch to build against: the same-named branch, else the PR's base branch.
      # Cloned first: its conda-lock.yml defines the environment.
      - name: Select EdelweissFE
        shell: bash
        run: |
          BRANCH="${{ inputs.edelweissfe_branch || github.head_ref || github.ref_name }}"
          BASE="${{ github.base_ref || 'master' }}"

          URL="https://github.com/Edelweiss-Numerics/EdelweissFE.git"
          if git ls-remote --exit-code --heads "$URL" "$BRANCH" > /dev/null 2>&1; then
            echo "Cloning EdelweissFE branch: $BRANCH"
            git clone --depth 1 --branch "$BRANCH" "$URL" "$RUNNER_TEMP/EdelweissFE"
          elif [ -n "$BASE" ] && git ls-remote --exit-code --heads "$URL" "$BASE" > /dev/null 2>&1; then
            echo "::warning title=EdelweissFE Branch Fallback::Branch '$BRANCH' not found. Falling back to PR base branch '$BASE'."
            git clone --depth 1 --branch "$BASE" "$URL" "$RUNNER_TEMP/EdelweissFE"
          else
            echo "::warning title=EdelweissFE Branch Fallback::Neither branch '$BRANCH' nor base '$BASE' found. Falling back to default branch."
            git clone --depth 1 "$URL" "$RUNNER_TEMP/EdelweissFE"
          fi

      # Exactly what EdelweissFE's conda-lock.yml pins (no solving), as EdelweissFE's own CI installs it
      # (its .github/actions/setup-locked-env): compilers, CMake, Eigen, autodiff, Fastor, AMGCL, the
      # free-threaded Python and the Python packages both projects need.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ runner.temp }}/EdelweissFE/conda-lock.yml
          environment-name: edelweissfe
          cache-environment: true
          init-shell: bash

      - name: Install Marmot
        shell: bash -leo pipefail {0}
        run: |
          BRANCH="${{ inputs.marmot_branch || github.head_ref || github.ref_name }}"
          BASE="${{ github.base_ref || 'master' }}"

          # Helper function for mandatory modules
          clone_mandatory() {
            local url=$1
            local dir=$2
            if [ -e "$dir" ]; then
              # the module is part of the Marmot tree itself (MAteRialMOdelingToolbox/Marmot#104 moves the meshfree core and
              # modules in-tree); a clone into the same directory would fail
              echo "Module $dir is already part of the Marmot tree, not cloning $url."
              return 0
            fi
            if git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null 2>&1; then
              git clone --depth 1 --branch "$BRANCH" "$url" "$dir"
            elif [ -n "$BASE" ] && git ls-remote --exit-code --heads "$url" "$BASE" > /dev/null 2>&1; then
              echo "::warning title=Marmot Branch Fallback::Branch '$BRANCH' not found in $url. Falling back to PR base branch '$BASE'."
              git clone --depth 1 --branch "$BASE" "$url" "$dir"
            else
              echo "::warning title=Marmot Branch Fallback::Neither branch '$BRANCH' nor base '$BASE' found in $url. Falling back to default branch."
              git clone --depth 1 "$url" "$dir"
            fi
          }

          # Helper function for optional modules
          clone_optional() {
            local url=$1
            local dir=$2
            if [ -e "$dir" ]; then
              # the module is part of the Marmot tree itself (MAteRialMOdelingToolbox/Marmot#104 moves the meshfree core and
              # modules in-tree); a clone into the same directory would fail
              echo "Module $dir is already part of the Marmot tree, not cloning $url."
              return 0
            fi
            if git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null 2>&1; then
              git clone --depth 1 --branch "$BRANCH" "$url" "$dir"
            elif [ -n "$BASE" ] && git ls-remote --exit-code --heads "$url" "$BASE" > /dev/null 2>&1; then
              echo "::warning title=Marmot Optional Module Fallback::Branch '$BRANCH' not found in $url. Falling back to PR base branch '$BASE'."
              git clone --depth 1 --branch "$BASE" "$url" "$dir"
            elif git ls-remote "$url" > /dev/null 2>&1; then
              echo "::warning title=Marmot Optional Module Fallback::Neither branch '$BRANCH' nor base '$BASE' found in $url. Falling back to default branch."
              git clone --depth 1 "$url" "$dir"
            else
              echo "Repository $url not available, skipping."
            fi
          }

          # Clone Repositories
          clone_mandatory "https://github.com/MAteRialMOdelingToolbox/Marmot.git" "$RUNNER_TEMP/Marmot"
          clone_mandatory "https://github.com/BOKU-CMP-MEC-MAT/MarmotMeshfreeCore.git" "$RUNNER_TEMP/Marmot/modules/core/MarmotMeshfreeCore"

          clone_optional "https://github.com/BOKU-CMP-MEC-MAT/DisplacementParticle.git" "$RUNNER_TEMP/Marmot/modules/particles/DisplacementParticle"
          clone_optional "https://github.com/BOKU-CMP-MEC-MAT/DisplacementMaterialPoint.git" "$RUNNER_TEMP/Marmot/modules/materialpoints/DisplacementMaterialPoint"

          # Build Marmot
          mkdir "$RUNNER_TEMP/Marmot/build"
          cd "$RUNNER_TEMP/Marmot/build"
          cmake -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF ..
          make -j 4 install
          cd ../..

      # --no-deps --no-build-isolation: everything comes from the locked environment, as in
      # EdelweissFE's CI; pip must neither resolve nor build in an isolated environment of its own.
      - name: Install EdelweissFE
        shell: bash -leo pipefail {0}
        run: |
          pip install -v --no-deps --no-build-isolation -e "$RUNNER_TEMP/EdelweissFE"

      - name: Build EdelweissMeshfree
        shell: bash -leo pipefail {0}
        run: |
          pip install -v --no-deps --no-build-isolation -e .

      - name: Run tests
        shell: bash -leo pipefail {0}
        run: |
          pytest .

